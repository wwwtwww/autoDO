name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置兼容的 Gradle 版本 (8.4)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: 注入 Debug 签名文件（从仓库读取，保证可覆盖安装）
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "✅ 已从仓库复制 debug.keystore 到 ~/.android/"
          else
            echo "::error::仓库中未找到 debug.keystore 文件！"
            exit 1
          fi

      - name: 运行单元测试
        run: gradle testDebugUnitTest --stacktrace

      - name: 上传测试结果报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unit-Test-Results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: 编译 APK 并保存日志
        run: gradle assembleDebug --stacktrace --info > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

      - name: 上传打包好的 APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: autoDO-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: 上传错误日志 (供排查)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Gradle-Error-Log
          path: build_log.txt
